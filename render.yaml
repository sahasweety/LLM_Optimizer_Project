services:
  # 1. API Service
  - type: web
    name: llm-api
    env: python
    plan: free
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.rest_api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false
      # IMPORTANT: Without a valid REDIS_URL, the cache is in-memory only.
      # On Render's free plan the filesystem is ephemeral and in-memory state
      # is lost on every deploy or restart, causing perpetual cache misses.
      # Set this to a Redis URL (Render Redis add-on, Upstash, etc.) to enable
      # persistent semantic caching across restarts.
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Cosine similarity threshold for semantic cache hits.
      # Range: 0.0–1.0. Lower = more permissive hits; higher = stricter.
      # 0.75 is recommended for Gemini Embedding 2 with asymmetric QUERY/DOCUMENT task_types.
      - key: SEMANTIC_CACHE_THRESHOLD
        value: "0.75"

  # 2. Dashboard Service
  - type: web
    name: llm-dashboard
    env: python
    plan: free
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: API_URL
        sync: false
      - key: DATABASE_URL
        sync: false
