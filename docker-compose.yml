version: '3.9'
services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: llmplatform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  api:
    build: .
    command: python -m uvicorn api.rest_api:app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/llmplatform
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - postgres
      - redis
      - kafka

  processor:
    build: .
    command: python run_processor.py
    environment:
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/llmplatform
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - kafka
      - api

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.headless true --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8081
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/llmplatform
    depends_on:
      - api
      - postgres

volumes:
  pgdata: